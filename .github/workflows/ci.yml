name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install system deps (as root)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            thunderbird xorg-x11-server-Xvfb git \
            python3.11 python3.11-devel \
            gcc which findutils curl sudo shadow-utils
          # TB refuses to run as root; create an unprivileged user for the rest.
          useradd -m -u 1001 tester

      - uses: actions/checkout@v4

      - name: Hand workspace to tester + install uv (as tester)
        run: |
          chown -R tester:tester "$GITHUB_WORKSPACE"
          sudo -u tester -H bash -lc '
            set -euo pipefail
            curl -LsSf https://astral.sh/uv/install.sh | sh
          '

      - name: Sync deps
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --frozen || uv sync
          '

      - name: Ruff
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv run ruff check
          '

      - name: Mypy
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv run mypy
          '

      - name: Tests
        env:
          TB_MCP_LOG_LEVEL: DEBUG
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            xvfb-run -a uv run pytest --cov=src --cov-report=term
          '
