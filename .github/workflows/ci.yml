name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:44
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports:
          - 3025:3025
          - 3143:3143
          - 8080:8080
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    steps:
      - name: Install system deps (as root)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            thunderbird xorg-x11-server-Xvfb git \
            python3.11 python3.11-devel \
            gcc which findutils curl sudo shadow-utils
          # TB refuses to run as root; create an unprivileged user for the rest.
          useradd -m -u 1001 tester

      - uses: actions/checkout@v4

      - name: Hand workspace to tester + install uv (as tester)
        run: |
          chown -R tester:tester "$GITHUB_WORKSPACE"
          sudo -u tester -H bash -lc '
            set -euo pipefail
            curl -LsSf https://astral.sh/uv/install.sh | sh
          '

      - name: Sync deps
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --frozen || uv sync
          '

      - name: Ruff
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv run ruff check
          '

      - name: Mypy
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            uv run mypy
          '

      - name: Tests
        env:
          TB_MCP_LOG_LEVEL: DEBUG
          TB_INTEGRATION_IMAP: "1"
          TB_INTEGRATION_GM_EXTERNAL: "1"
          GREENMAIL_HOST: greenmail
        run: |
          sudo -u tester -H bash -lc '
            cd "'"$GITHUB_WORKSPACE"'"
            export PATH="$HOME/.local/bin:$PATH"
            export TB_INTEGRATION_IMAP="'"$TB_INTEGRATION_IMAP"'"
            export TB_INTEGRATION_GM_EXTERNAL="'"$TB_INTEGRATION_GM_EXTERNAL"'"
            export GREENMAIL_HOST="'"$GREENMAIL_HOST"'"
            xvfb-run -a uv run pytest --cov=src --cov-report=term
          '
