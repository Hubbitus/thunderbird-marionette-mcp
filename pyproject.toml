[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tb-marionette-mcp"
version = "0.1.0"
description = "MCP server for Thunderbird UI automation via Marionette"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pavel Alexeev", email = "Pahan@hubbitus.info" }]
dependencies = [
    "mcp>=1.12,<2.0",
    "marionette-driver>=3.7.1,<4.0",
    "pydantic>=2.6,<3.0",
    "structlog>=24.1",
]

[project.scripts]
tb-marionette-mcp = "tb_marionette_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Hubbitus/thunderbird-marionette-mcp"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tb_marionette_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = "marionette_driver.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
